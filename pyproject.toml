[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chiralite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "cryptography>=42.0",
    "aiofiles>=23.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "watchdog>=4.0",
    "pathspec>=0.12",
    "typer>=0.12",
    "pyyaml>=6.0",
    "cffi>=1.17",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.9", "ruff>=0.4"]

[project.scripts]
chiralite = "chiralite.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
